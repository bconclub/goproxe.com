name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/goproxe
            # Force-sync to origin/main. reset --hard never fails on a dirty tree
            # or a stray untracked file, and it leaves untracked .env.local intact.
            git fetch origin
            git reset --hard origin/main
            npm ci --production=false
            rm -rf .next
            export NODE_OPTIONS="--max-old-space-size=2048"
            npm run build
            pm2 restart goproxe || pm2 start npm --name goproxe -- start
            pm2 save
